name: 'SitePong Publish OTA Update'
description: 'Publish Expo OTA updates to SitePong using GitHub OIDC trusted publishing (no API key needed)'

inputs:
  project-id:
    description: 'SitePong project ID'
    required: true
  runtime-version:
    description: 'Expo runtime version'
    required: true
  changelog:
    description: 'Changelog for this OTA update'
    required: true
  profile:
    description: 'SitePong build profile name (e.g. Development, Production). Required — used to resolve EXPO_PUBLIC_* env vars for the JS bundle.'
    required: true
  app-version:
    description: 'App version (e.g. 1.0.0). If omitted, inherits from the latest native build.'
    required: false
    default: ''
  platform:
    description: 'Target platform (ios, android, or all)'
    default: 'all'
  working-directory:
    description: 'Path to the app root within the repo (e.g. app, mobile-app, packages/mobile)'
    default: '.'
  dist-dir:
    description: 'Directory containing the expo export output (relative to working-directory)'
    default: 'dist'
  channel:
    description: 'OTA channel name. Defaults to branch name (main/master→default, other→branch name).'
    required: false
    default: ''
  updates-url:
    description: 'SitePong updates server URL'
    default: 'https://updates.sitepong.com'
  skip-export:
    description: 'Skip expo export (if you already ran it with env vars set up). Default: false.'
    required: false
    default: 'false'

  upload-sourcemaps:
    description: >-
      Upload the *.map files next to each bundle so SitePong can symbolicate
      error stack traces for this update (stored with release = update id).
      When the action runs `expo export` itself it passes `--source-maps`
      (alias `--dump-sourcemap`; @expo/cli 55). With skip-export: true you
      must run `npx expo export --source-maps` yourself or no maps exist to
      upload. Default: true.
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # Every input reaches the scripts below through `env:` and is used as a
    # quoted shell variable. Never paste ${{ inputs.* }} into a `run:` block:
    # a changelog with a double quote broke the quoting, and one with $(...)
    # would have run on the runner with the publish token in scope.
    - name: Get OIDC token
      id: oidc
      shell: bash
      env:
        UPDATES_URL: ${{ inputs.updates-url }}
      run: |
        OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$UPDATES_URL" | jq -r '.value')
        if [ "$OIDC_TOKEN" = "null" ] || [ -z "$OIDC_TOKEN" ]; then
          echo "::error::Failed to get OIDC token. Ensure 'permissions: id-token: write' is set."
          exit 1
        fi
        echo "::add-mask::$OIDC_TOKEN"
        echo "token=$OIDC_TOKEN" >> "$GITHUB_OUTPUT"

    - name: Exchange for publish token
      id: exchange
      shell: bash
      env:
        UPDATES_URL: ${{ inputs.updates-url }}
        PROJECT_ID: ${{ inputs.project-id }}
        OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
      run: |
        PAYLOAD=$(jq -n --arg t "$OIDC_TOKEN" --arg p "$PROJECT_ID" '{oidc_token: $t, project_id: $p}')
        RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$UPDATES_URL/token/exchange" \
          -H "Content-Type: application/json" \
          --data-binary "$PAYLOAD")
        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | sed '$d')
        if [ "$HTTP_CODE" != "200" ]; then
          echo "::error::Token exchange failed ($HTTP_CODE): $BODY"
          exit 1
        fi
        PUBLISH_TOKEN=$(echo "$BODY" | jq -r '.token')
        echo "::add-mask::$PUBLISH_TOKEN"
        echo "token=$PUBLISH_TOKEN" >> "$GITHUB_OUTPUT"

    - name: Fetch env vars and export to GITHUB_ENV
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        UPDATES_URL: ${{ inputs.updates-url }}
        PROFILE: ${{ inputs.profile }}
        PUBLISH_TOKEN: ${{ steps.exchange.outputs.token }}
      run: |
        echo "Fetching EXPO_PUBLIC_* env vars for profile '$PROFILE'..."
        RESPONSE=$(curl -s -w "\n%{http_code}" -G "$UPDATES_URL/env-vars" \
          --data-urlencode "profile=$PROFILE" \
          -H "Authorization: Bearer $PUBLISH_TOKEN")
        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" != "200" ]; then
          echo "::error::Failed to fetch env vars ($HTTP_CODE): $BODY"
          exit 1
        fi

        # Mask every value before anything can print it (expo export echoes
        # its environment, which is how a live token reached the log). Values
        # of 3 characters or fewer are skipped: GitHub would then blank every
        # "1" or "on" in the whole log, and they are not secrets.
        echo "$BODY" | jq -r '.env | to_entries[] | .value | tostring' | while IFS= read -r line; do
          if [ ${#line} -gt 3 ]; then echo "::add-mask::$line"; fi
        done

        # .env for tools that read it, and GITHUB_ENV so later steps get real
        # shell vars. GITHUB_ENV uses the delimiter form so a value containing
        # a newline cannot inject another variable.
        : > .env
        COUNT=0
        while IFS= read -r KEY; do
          VALUE=$(echo "$BODY" | jq -r --arg k "$KEY" '.env[$k] | tostring')
          printf '%s=%s\n' "$KEY" "$VALUE" >> .env
          DELIM="SITEPONG_ENV_$(openssl rand -hex 8)"
          {
            printf '%s<<%s\n' "$KEY" "$DELIM"
            printf '%s\n' "$VALUE"
            printf '%s\n' "$DELIM"
          } >> "$GITHUB_ENV"
          COUNT=$((COUNT + 1))
          echo "  - $KEY"
        done < <(echo "$BODY" | jq -r '.env | keys[]' | grep -E '^[A-Za-z_][A-Za-z0-9_]*$')
        echo "Exported $COUNT env vars to GITHUB_ENV and .env"

    - name: Export Expo bundle
      if: inputs.skip-export != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLATFORMS: ${{ inputs.platform }}
        UPLOAD_SOURCEMAPS: ${{ inputs.upload-sourcemaps }}
      run: |
        EXPORT_ARGS=(--platform "$PLATFORMS")
        # Source maps are opt-in for `expo export` (`-s, --source-maps`,
        # alias `--dump-sourcemap`); emit them so the publish step can upload
        # them for stack-trace symbolication.
        if [ "$UPLOAD_SOURCEMAPS" = "true" ]; then
          EXPORT_ARGS+=(--source-maps)
        fi
        npx expo export "${EXPORT_ARGS[@]}"

    - name: Compute package hash
      id: pkghash
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ ! -f "package.json" ]; then
          echo "::error::package.json not found in working directory"
          exit 1
        fi
        HASH=$(sha256sum package.json 2>/dev/null || shasum -a 256 package.json)
        HASH=$(echo "$HASH" | cut -d' ' -f1)
        echo "hash=$HASH" >> "$GITHUB_OUTPUT"
        echo "Package hash: $HASH"

    - name: Publish OTA update
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DIST_DIR: ${{ inputs.dist-dir }}
        PLATFORMS: ${{ inputs.platform }}
        INPUT_CHANNEL: ${{ inputs.channel }}
        UPDATES_URL: ${{ inputs.updates-url }}
        PUBLISH_TOKEN: ${{ steps.exchange.outputs.token }}
        RUNTIME_VERSION: ${{ inputs.runtime-version }}
        CHANGELOG: ${{ inputs.changelog }}
        PACKAGE_HASH: ${{ steps.pkghash.outputs.hash }}
        APP_VERSION: ${{ inputs.app-version }}
        UPLOAD_SOURCEMAPS: ${{ inputs.upload-sourcemaps }}
      run: |
        if [ ! -d "$DIST_DIR" ]; then
          echo "::error::Distribution directory '$DIST_DIR' not found. Run 'npx expo export' first."
          exit 1
        fi

        if [ "$PLATFORMS" = "all" ]; then
          PLATFORMS="ios android"
        fi

        for PLATFORM in $PLATFORMS; do
          BUNDLE_DIR="$DIST_DIR/_expo/static/js/$PLATFORM"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "::warning::No $PLATFORM bundles found in $BUNDLE_DIR, skipping"
            continue
          fi

          # Resolve channel: explicit input > branch name > default
          CHANNEL="$INPUT_CHANNEL"
          if [ -z "$CHANNEL" ]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
              CHANNEL="default"
            else
              CHANNEL="$BRANCH"
            fi
          fi

          # Build curl multipart args. Text fields use --form-string: with -F,
          # a value starting with @ or < is read as a file path.
          CURL_ARGS=(
            -s -w "\n%{http_code}"
            -X POST "$UPDATES_URL/publish"
            -H "Authorization: Bearer $PUBLISH_TOKEN"
            --form-string "runtimeVersion=$RUNTIME_VERSION"
            --form-string "platform=$PLATFORM"
            --form-string "changelog=$CHANGELOG"
            --form-string "packageHash=$PACKAGE_HASH"
            --form-string "name=$CHANNEL"
          )

          # Add app_version if provided
          if [ -n "$APP_VERSION" ]; then
            CURL_ARGS+=(--form-string "app_version=$APP_VERSION")
          fi

          # Add expo metadata files (content types + app config for manifest)
          if [ -f "$DIST_DIR/metadata.json" ]; then
            CURL_ARGS+=(-F "expoMetadata=@$DIST_DIR/metadata.json;type=application/json")
          fi
          # Send expoConfig for manifest extra.expoClient (required by native expo-updates)
          if [ -f "$DIST_DIR/expoConfig.json" ]; then
            CURL_ARGS+=(-F "expoConfig=@$DIST_DIR/expoConfig.json;type=application/json")
          elif [ -f "app.json" ]; then
            # Extract expo config from app.json (newer expo versions don't export expoConfig.json)
            EXPO_CONFIG=$(node -e "const c = require('./app.json'); console.log(JSON.stringify(c.expo || c))")
            CURL_ARGS+=(--form-string "expoConfig=$EXPO_CONFIG")
          fi

          # Add bundle files. Source maps (*.map, emitted by `expo export
          # --source-maps`) ride along in the same multipart POST when
          # upload-sourcemaps is true; the server stores them in source_maps
          # under release = update id and never serves them as OTA assets.
          FILE_COUNT=0
          MAP_COUNT=0
          for FILE in "$BUNDLE_DIR"/*; do
            [ -f "$FILE" ] || continue
            case "$FILE" in
              *.map)
                [ "$UPLOAD_SOURCEMAPS" = "true" ] || continue
                CURL_ARGS+=(-F "file=@$FILE;type=application/json")
                MAP_COUNT=$((MAP_COUNT + 1))
                continue
                ;;
            esac
            CURL_ARGS+=(-F "file=@$FILE")
            FILE_COUNT=$((FILE_COUNT + 1))
          done
          if [ "$UPLOAD_SOURCEMAPS" = "true" ] && [ "$MAP_COUNT" -eq 0 ]; then
            echo "::warning::No source maps found in $BUNDLE_DIR — run 'npx expo export --source-maps' so $PLATFORM errors can be symbolicated"
          fi

          # Add shared assets
          ASSETS_DIR="$DIST_DIR/assets"
          if [ -d "$ASSETS_DIR" ]; then
            for FILE in "$ASSETS_DIR"/*; do
              [ -f "$FILE" ] || continue
              CURL_ARGS+=(-F "file=@$FILE")
              FILE_COUNT=$((FILE_COUNT + 1))
            done
          fi

          echo "Publishing $PLATFORM update ($FILE_COUNT files, $MAP_COUNT source maps)..."

          RESPONSE=$(curl "${CURL_ARGS[@]}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Publish failed for $PLATFORM ($HTTP_CODE): $BODY"
            exit 1
          fi

          echo "Successfully published $PLATFORM update"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
        done
